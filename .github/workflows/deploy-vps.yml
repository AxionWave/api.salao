name: Deploy VPS

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: deploy-vps-api-salao
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy api.salao
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 40m
          script: |
            set -e
            mkdir -p /opt/enterprise
            if [ ! -d /opt/enterprise/api.salao/.git ]; then
              git clone -b production git@github.com:AxionWave/api.salao.git /opt/enterprise/api.salao
            fi
            cd /opt/enterprise/api.salao
            git fetch origin production
            git checkout production
            git reset --hard origin/production
            docker exec postgres psql -U postgres -d base -c "CREATE SCHEMA IF NOT EXISTS lyra;"
            # O override do repositório é só para a máquina local (Development e porta publicada).
            docker compose -f docker-compose.yml --env-file /opt/enterprise/.env up -d --build
            if [ -f infra/seed-sistema.sql ]; then
              docker exec -i postgres psql -U postgres -d base < infra/seed-sistema.sql || true
            fi
            status=starting
            for i in $(seq 1 36); do
              status=$(docker inspect -f '{{.State.Health.Status}}' salao 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then break; fi
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              docker logs --tail 120 salao
              exit 1
            fi
            cd /opt/enterprise/Gateway
            docker compose --env-file /opt/enterprise/.env up -d
            docker compose -f /opt/enterprise/api.salao/docker-compose.yml --env-file /opt/enterprise/.env ps
